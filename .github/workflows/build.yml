name: JARVIS builds
on:
  workflow_dispatch:
  push:
    branches: [main, integrate-tokenarc-open-jarvis]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply Android Kotlin source fixes
        run: python3 .github/scripts/fix_android_kotlin.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace clean :app:compileDebugKotlin :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r pc/requirements.txt
      - name: Build executable
        run: pyinstaller --clean --onefile --windowed --name JARVIS pc/jarvis.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: dist/JARVIS.exe
          if-no-files-found: error
